name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # dist/ is committed (so `npm test` works right after clone) and
      # must match a fresh `tsc` build exactly: a stale dist/ fails CI.
      - run: git diff --exit-code -- dist/
        name: committed dist matches a fresh build
      - run: npm test
      - run: node scripts/preflight.js
        name: preflight (Rule 7 - ASCII-only + no-internal-names scan)
      - run: npm run test:live
        name: live smoke (soft-skip offline)
